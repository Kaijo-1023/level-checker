<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>光レベル測定 撮影アプリ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Share+Tech+Mono&display=swap');

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --sub: #8b949e;
  --green: #3fb950;
  --green-dim: #1a3a22;
  --orange: #f0883e;
  --orange-dim: #3d2400;
  --blue: #58a6ff;
  --blue-dim: #0d2340;
  --red: #f85149;
  --red-dim: #3d0f0d;
  --yellow: #d29922;
  --yellow-dim: #2d2000;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
}

/* ヘッダー */
.hdr {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 100;
}
.hdr-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #3fb950, #1a7f37);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.hdr-text h1 { font-size: 15px; font-weight: 900; letter-spacing: 0.03em; }
.hdr-text p { font-size: 10px; color: var(--sub); margin-top: 1px; font-family: 'Share Tech Mono', monospace; }
.hdr-count {
  margin-left: auto;
  background: var(--green-dim);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 12px; font-weight: 700;
  font-family: 'Share Tech Mono', monospace;
}

.wrap { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

/* カード */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.card-hdr {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  background: var(--surface2);
}
.card-hdr .label {
  font-size: 11px; font-weight: 700;
  color: var(--sub); letter-spacing: 0.08em; text-transform: uppercase;
}
.card-body { padding: 12px 14px; }

/* 測定種別 */
.type-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.type-btn {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 12px 8px;
  background: var(--surface2);
  color: var(--sub);
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 13px; font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  line-height: 1.4;
}
.type-btn .icon { font-size: 20px; display: block; margin-bottom: 4px; }
.type-btn:hover { border-color: var(--green); color: var(--text); }
.type-btn.sel-hoso   { border-color: var(--blue);   background: var(--blue-dim);   color: var(--blue);   }
.type-btn.sel-tsushin{ border-color: var(--green);  background: var(--green-dim);  color: var(--green);  }
.type-btn.sel-seitan { border-color: var(--orange); background: var(--orange-dim); color: var(--orange); }
.type-btn.sel-donu   { border-color: var(--red);    background: var(--red-dim);    color: var(--red);    }

/* ファイル名プレビュー */
.fname-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--sub);
  word-break: break-all;
  line-height: 1.8;
  min-height: 36px;
}
.fname-box .hi-blue   { color: var(--blue); }
.fname-box .hi-green  { color: var(--green); }
.fname-box .hi-orange { color: var(--orange); }
.fname-box .hi-red    { color: var(--red); }
.fname-box .sep       { color: var(--border); }
.fname-box .ph        { color: #444; font-style: italic; }

/* カメラ */
#videoWrap {
  position: relative;
  background: #000;
  border-radius: 8px;
  overflow: hidden;
  aspect-ratio: 4/3;
  display: none;
}
#videoWrap.active { display: block; }
#video { width: 100%; height: 100%; object-fit: cover; display: block; }
#canvas { display: none; }

/* コーナー装飾 */
.corner { position: absolute; width: 18px; height: 18px; border-color: var(--green); border-style: solid; opacity: 0.8; }
.corner.tl { top: 8px; left: 8px;   border-width: 2px 0 0 2px; }
.corner.tr { top: 8px; right: 8px;  border-width: 2px 2px 0 0; }
.corner.bl { bottom: 8px; left: 8px;  border-width: 0 0 2px 2px; }
.corner.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

/* タイプバッジ（カメラ上のオーバーレイ） */
.cam-badge {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
  border-radius: 99px; padding: 4px 14px;
  font-size: 12px; font-weight: 700;
  border: 1px solid rgba(255,255,255,0.15);
  white-space: nowrap; pointer-events: none;
}

/* シャッターコントロール */
.cam-ctrl {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 8px;
}
.ctrl-side { width: 52px; }

.shutter {
  width: 70px; height: 70px; border-radius: 50%;
  background: #fff; border: 4px solid var(--green);
  cursor: pointer; transition: all 0.12s;
  box-shadow: 0 0 20px rgba(63,185,80,0.3);
  display: flex; align-items: center; justify-content: center;
}
.shutter:hover  { transform: scale(1.05); box-shadow: 0 0 28px rgba(63,185,80,0.5); }
.shutter:active { transform: scale(0.92); background: #d1f0d8; }
.shutter-inner  { width: 52px; height: 52px; background: var(--green); border-radius: 50%; }

.flip-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--sub); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.flip-btn:hover { border-color: var(--green); color: var(--text); }

/* ボタン */
.btn-row { display: flex; gap: 8px; }
.btn {
  flex: 1; padding: 13px; border: none; border-radius: 8px;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 14px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.15s;
}
.btn-primary { background: var(--green); color: #0d1117; }
.btn-primary:hover { filter: brightness(1.1); }
.btn-primary:disabled { background: var(--surface2); color: var(--sub); cursor: not-allowed; }
.btn-secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--text); flex: 0; padding: 13px 16px; font-size: 13px; }
.btn-secondary:hover { border-color: var(--green); }

/* 写真リスト */
.photo-list { display: flex; flex-direction: column; gap: 8px; }
.empty { color: var(--sub); font-size: 13px; text-align: center; padding: 20px 0; }

.photo-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  display: flex; align-items: center; gap: 10px;
}
.photo-thumb { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); }
.photo-info { flex: 1; min-width: 0; }
.photo-badge {
  display: inline-block; border-radius: 4px; padding: 1px 7px;
  font-size: 10px; font-weight: 700; margin-bottom: 4px;
}
.badge-hoso   { background: var(--blue-dim);   color: var(--blue);   border: 1px solid var(--blue);   }
.badge-tsushin{ background: var(--green-dim);  color: var(--green);  border: 1px solid var(--green);  }
.badge-seitan { background: var(--orange-dim); color: var(--orange); border: 1px solid var(--orange); }
.badge-donu   { background: var(--red-dim);    color: var(--red);    border: 1px solid var(--red);    }

.photo-name { font-family: 'Share Tech Mono', monospace; font-size: 9.5px; color: var(--sub); word-break: break-all; line-height: 1.5; }
.photo-time { font-size: 10px; color: #444; margin-top: 2px; }

.dl-btn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--sub); border-radius: 6px;
  padding: 6px 12px; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: 'Zen Kaku Gothic New', sans-serif;
  flex-shrink: 0; transition: all 0.15s;
}
.dl-btn:hover { border-color: var(--green); color: var(--green); }

/* トースト */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--surface2); border: 1px solid var(--green);
  color: var(--text); padding: 10px 20px; border-radius: 99px;
  font-size: 13px; font-weight: 700; white-space: nowrap;
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 999; pointer-events: none;
  box-shadow: 0 4px 20px rgba(63,185,80,0.2);
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* フラッシュ */
.flash {
  position: absolute; inset: 0; background: #fff;
  opacity: 0; pointer-events: none; transition: opacity 0.1s;
  border-radius: 8px;
}
.flash.on { opacity: 1; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-icon">📡</div>
  <div class="hdr-text">
    <h1>光レベル測定 撮影</h1>
    <p>CATV LEVEL CHECK RECORDER</p>
  </div>
  <div class="hdr-count" id="photoCount">0 枚</div>
</div>

<div class="wrap">

  <!-- STEP1: 測定種別 -->
  <div class="card">
    <div class="card-hdr">
      <span id="s1" class="step-dot">●</span>
      <span class="label">測定種別を選択</span>
    </div>
    <div class="card-body">
      <div class="type-grid">
        <button class="type-btn" id="btn-hoso"    onclick="selectType('hoso')">
          <span class="icon">📺</span>放送
        </button>
        <button class="type-btn" id="btn-tsushin" onclick="selectType('tsushin')">
          <span class="icon">🌐</span>通信
        </button>
        <button class="type-btn" id="btn-seitan"  onclick="selectType('seitan')">
          <span class="icon">🔌</span>V-ONU
        </button>
        <button class="type-btn" id="btn-donu"    onclick="selectType('donu')">
          <span class="icon">📦</span>D-ONU
        </button>
      </div>
    </div>
  </div>

  <!-- ファイル名プレビュー -->
  <div class="card">
    <div class="card-hdr">
      <span class="label">保存ファイル名プレビュー</span>
    </div>
    <div class="card-body" style="padding: 10px 14px;">
      <div class="fname-box" id="fnamePreview">
        <span class="ph">種別を選択するとファイル名が表示されます</span>
      </div>
    </div>
  </div>

  <!-- STEP2: カメラ -->
  <div class="card">
    <div class="card-hdr">
      <span class="label">撮影</span>
    </div>
    <div class="card-body" style="display:flex; flex-direction:column; gap:10px;">
      <div id="videoWrap">
        <video id="video" autoplay playsinline muted></video>
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="cam-badge" id="camBadge">種別未選択</div>
        <div class="flash" id="flash"></div>
      </div>
      <canvas id="canvas"></canvas>

      <div id="cameraOff">
        <div class="btn-row">
          <button class="btn btn-primary" id="startBtn" onclick="startCamera()" disabled>
            📷 カメラ起動
          </button>
        </div>
      </div>

      <div id="cameraOn" style="display:none; flex-direction:column; gap:10px;">
        <div class="cam-ctrl">
          <div class="ctrl-side"></div>
          <div class="shutter" onclick="takePhoto()">
            <div class="shutter-inner"></div>
          </div>
          <div class="ctrl-side" style="display:flex; justify-content:flex-end;">
            <button class="flip-btn" onclick="flipCam()">🔄</button>
          </div>
        </div>
        <button class="btn btn-secondary" onclick="stopCamera()">■ カメラ停止</button>
      </div>
    </div>
  </div>

  <!-- 写真リスト -->
  <div class="card" id="photoCard">
    <div class="card-hdr">
      <span class="label">撮影済み</span>
      <span id="photoCountSub" style="margin-left:auto; font-size:11px; color:var(--sub); font-family:'Share Tech Mono',monospace;">0枚</span>
    </div>
    <div class="card-body">
      <div class="photo-list" id="photoList">
        <div class="empty">まだ撮影していません</div>
      </div>
      <div id="dlAllWrap" style="display:none; margin-top:10px;">
        <button class="btn btn-secondary" style="flex:1; width:100%;" onclick="downloadAll()">⬇ 全て保存</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let selectedType = null;
let facingMode = 'environment';
let stream = null;
let photos = [];

const TYPE_MAP = {
  hoso:    { label: '放送',  cls: 'sel-hoso',    badge: 'badge-hoso',    color: 'hi-blue',   emoji: '📺' },
  tsushin: { label: '通信',  cls: 'sel-tsushin', badge: 'badge-tsushin', color: 'hi-green',  emoji: '🌐' },
  seitan:  { label: 'V-ONU', cls: 'sel-seitan',  badge: 'badge-seitan',  color: 'hi-orange', emoji: '🔌' },
  donu:    { label: 'D-ONU', cls: 'sel-donu',    badge: 'badge-donu',    color: 'hi-red',    emoji: '📦' },
};

function selectType(type) {
  selectedType = type;
  // ボタン見た目
  Object.keys(TYPE_MAP).forEach(k => {
    const btn = document.getElementById('btn-' + k);
    btn.className = 'type-btn' + (k === type ? ' sel-' + k : '');
  });
  // カメラバッジ
  const t = TYPE_MAP[type];
  document.getElementById('camBadge').textContent = t.emoji + ' ' + t.label;
  document.getElementById('camBadge').style.color = '';
  // スタートボタン有効化
  document.getElementById('startBtn').disabled = false;
  updatePreview();
}

function getTs() {
  const n = new Date();
  const d = `${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}`;
  const t = `${p(n.getHours())}${p(n.getMinutes())}${p(n.getSeconds())}`;
  return { d, t };
}
function p(v) { return String(v).padStart(2,'0'); }

function getFilename() {
  const t = TYPE_MAP[selectedType];
  const { d, t: ti } = getTs();
  return `level_${t.label}_${d}_${ti}.jpg`;
}

function updatePreview() {
  const el = document.getElementById('fnamePreview');
  if (!selectedType) {
    el.innerHTML = '<span class="ph">種別を選択するとファイル名が表示されます</span>';
    return;
  }
  const t = TYPE_MAP[selectedType];
  const { d, t: ti } = getTs();
  el.innerHTML = `<span class="sep">level_</span><span class="${t.color}">${t.label}</span><span class="sep">_</span>${d}<span class="sep">_</span>${ti}<span class="sep">.jpg</span>`;
}

async function startCamera() {
  if (!selectedType) { showToast('⚠ 測定種別を選んでください'); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    document.getElementById('video').srcObject = stream;
    document.getElementById('videoWrap').classList.add('active');
    document.getElementById('cameraOff').style.display = 'none';
    document.getElementById('cameraOn').style.display = 'flex';
  } catch(e) {
    showToast('⚠ カメラにアクセスできません');
  }
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('videoWrap').classList.remove('active');
  document.getElementById('cameraOff').style.display = 'block';
  document.getElementById('cameraOn').style.display = 'none';
}

async function flipCam() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  stopCamera(); await startCamera();
}

function takePhoto() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.93);
  const filename = getFilename();
  const time = new Date().toLocaleTimeString('ja-JP');

  // フラッシュ
  const flash = document.getElementById('flash');
  flash.classList.add('on');
  setTimeout(() => flash.classList.remove('on'), 150);

  photos.unshift({ dataUrl, filename, time, type: selectedType });
  renderPhotos();
  showToast('📸 撮影しました');
}

function renderPhotos() {
  const list = document.getElementById('photoList');
  const count = photos.length;
  document.getElementById('photoCount').textContent = count + ' 枚';
  document.getElementById('photoCountSub').textContent = count + '枚';
  document.getElementById('dlAllWrap').style.display = count > 1 ? 'block' : 'none';

  if (!count) { list.innerHTML = '<div class="empty">まだ撮影していません</div>'; return; }

  list.innerHTML = photos.map((p, i) => {
    const t = TYPE_MAP[p.type];
    return `
    <div class="photo-item">
      <img src="${p.dataUrl}" class="photo-thumb">
      <div class="photo-info">
        <span class="photo-badge ${t.badge}">${t.emoji} ${t.label}</span>
        <div class="photo-name">${p.filename}</div>
        <div class="photo-time">${p.time}</div>
      </div>
      <button class="dl-btn" onclick="dlPhoto(${i})">保存</button>
    </div>`;
  }).join('');
}

function dlPhoto(i) {
  const a = document.createElement('a');
  a.href = photos[i].dataUrl;
  a.download = photos[i].filename;
  a.click();
}

function downloadAll() {
  photos.forEach((_, i) => setTimeout(() => dlPhoto(i), i * 300));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

setInterval(updatePreview, 30000);
</script>
</body>
</html>
